<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- webpackIgnore: true -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <style>
    body {
      background-color: var(--portfolio-bg, #080B14);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Software Engineer Portfolio | Interactive Workstation</title>
  <meta name="title" content="Software Engineer Portfolio">
  <meta name="description" content="An interactive portfolio for a software engineer.">
  <script>
    window.portfolioRuntimeConfig = window.portfolioRuntimeConfig || { innerSiteUrl: null };
  </script>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Software Engineer Portfolio">
  <meta property="og:description" content="An interactive portfolio for a software engineer.">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:title" content="Software Engineer Portfolio">
  <meta name="twitter:title" content="Software Engineer Portfolio">
  <meta property="twitter:description" content="An interactive portfolio for a software engineer.">
  <meta name="twitter:description" content="An interactive portfolio for a software engineer.">

</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop preload="none" width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop preload="none" width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
